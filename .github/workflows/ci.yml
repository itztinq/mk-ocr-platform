name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mk-ocr-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mk-ocr-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "backend=${{ secrets.DOCKERHUB_USERNAME }}/mk-ocr-backend:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "frontend=${{ secrets.DOCKERHUB_USERNAME }}/mk-ocr-frontend:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Update deployment YAMLs
        run: |
          sed -i "s|image: .*/mk-ocr-backend:.*|image: ${{ steps.tags.outputs.backend }}|" k8s/backend/deployment.yaml
          sed -i "s|image: .*/mk-ocr-frontend:.*|image: ${{ steps.tags.outputs.frontend }}|" k8s/frontend/deployment.yaml

      - name: Commit and push to trigger Argo CD sync
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@mk-ocr-platform"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags [skip ci]"
          git push

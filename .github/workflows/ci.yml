# ─── Required GitHub Secrets ───────────────────────────────────
# DOCKERHUB_USERNAME   — Docker Hub username (CI jobs)
# DOCKERHUB_TOKEN      — Docker Hub access token (CI jobs)
# DEPLOY_HOST          — IP/hostname of the deployment server  (CD job)
# DEPLOY_USER          — SSH username on the deployment server (CD job)
# DEPLOY_SSH_KEY       — SSH private key for authentication    (CD job)
# DEPLOY_PORT          — SSH port, defaults to 22              (CD job, optional)
#
# To skip CD, simply omit the DEPLOY_* secrets — the deploy job
# will auto-skip if the SSH key is not set.
# ───────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mk-ocr-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mk-ocr-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        if: env.DEPLOY_HOST != ''
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            echo "Pulling new images..."
            kubectl rollout restart -n mk-ocr-app deployment/backend
            kubectl rollout restart -n mk-ocr-app deployment/frontend
            echo "Waiting for backend rollout..."
            kubectl rollout status -n mk-ocr-app deployment/backend --timeout=120s
            echo "Waiting for frontend rollout..."
            kubectl rollout status -n mk-ocr-app deployment/frontend --timeout=120s
            echo "Deploy complete!"

      - name: Skipped — no SSH host configured
        if: env.DEPLOY_HOST == ''
        run: |
          echo "DEPLOY_HOST not set — CD skipped."
          echo "To enable auto-deploy, add these secrets:"
          echo "  DEPLOY_HOST     (server IP/hostname)"
          echo "  DEPLOY_USER     (SSH username)"
          echo "  DEPLOY_SSH_KEY  (SSH private key)"

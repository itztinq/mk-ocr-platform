apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mk-ocr-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: martinnq/mk-ocr-frontend:sha-62e8022
          ports:
            - containerPort: 80
